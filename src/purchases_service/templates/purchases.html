<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Compras</title>
</head>
<body>
  <h1>Compras registradas</h1>

  {% if purchases %}
    {% for p in purchases %}
      <div class="purchase-card">
        <p>ID: {{ p.id }}</p>
        <p>Usuario: {{ p.user_id }}</p>
        <p>Producto: {{ p.product_id }}</p>
        <p>Fecha: {{ p.timestamp }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No hay compras registradas.</p>
  {% endif %}
</body>
</html>
